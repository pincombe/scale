name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Size guard (2 MB, self-contained)
        run: npm run size

      - name: Balance sim
        run: npm run sim

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale-index-html
          path: dist/index.html
          if-no-files-found: ignore
          retention-days: 7
